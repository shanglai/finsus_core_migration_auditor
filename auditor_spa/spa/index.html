<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditor independiente — motor C</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --linea:#dfe3e8; --texto:#1a1d21; --suave:#5b636d;
  --ok:#137a4a; --ok-bg:#e6f4ec; --mal:#b3261e; --mal-bg:#fdeceb;
  --alerta:#8a6100; --alerta-bg:#fdf3d9; --neutro:#4a5568; --neutro-bg:#eef1f4;
  --doc:#1b5fa8; --doc-bg:#e6effa; --config:#137a4a; --config-bg:#e6f4ec;
  --norma:#6b3fa0; --norma-bg:#f0eaf9; --infer:#5b636d; --infer-bg:#eef1f4;
  --acento:#1b5fa8;
}
@media (prefers-color-scheme: dark){:root:not([data-tema="claro"]){
  --bg:#14171a; --panel:#1c2024; --linea:#2e343b; --texto:#e8eaed; --suave:#9aa3ad;
  --ok:#5bd18f; --ok-bg:#12301f; --mal:#ff8a80; --mal-bg:#3a1614;
  --alerta:#ffd166; --alerta-bg:#3a2f10; --neutro:#b0b8c1; --neutro-bg:#252b31;
  --doc:#7db3ea; --doc-bg:#16283d; --config:#5bd18f; --config-bg:#12301f;
  --norma:#c0a6f0; --norma-bg:#251c38; --infer:#9aa3ad; --infer-bg:#252b31;
  --acento:#7db3ea;
}}

/* ===== Tema LINKO ==========================================================
   Tokens tomados de _ds/linko-design-system-.../tokens/*.css y mapeados a las
   variables que ya usa el tablero, para no reescribir ni un componente.

   La fuente NO se importa: `tokens/fonts.css` trae un @import de Google Fonts
   y este SPA no carga nada por CDN (hay una prueba que lo verifica). Se usa la
   pila de respaldo que el propio token declara — Helvetica Neue / Arial —, que
   es la que Linko lista despues de Archivo.

   El verde de marca (#02b101) se reserva para el acento y la identidad. NO se
   usa para "conforme": el verde semantico del tablero tiene que seguir
   significando "cuadra", y teñirlo de marca haria que la marca parezca un
   veredicto. */
:root[data-tema="linko"]{
  --green-500:#02b101; --green-600:#019701; --green-400:#3bb75e;
  --ink-900:#09353b;   --ink-700:#1c4a50;   --ink-300:#828385;

  --bg:#f8faf8;              /* neutral-50, surface-page */
  --panel:#ffffff;           /* neutral-0,  surface-card */
  --linea:#e6e7e6;           /* neutral-200, border-subtle */
  --texto:#09353b;           /* ink-900, text-heading */
  --suave:#828385;           /* ink-300, text-muted */
  --acento:#02b101;          /* brand */

  --ok:#0f7a3d;   --ok-bg:#d2edd7;       /* green-100 */
  --mal:#b3261e;  --mal-bg:#fdeceb;
  --alerta:#8a6100; --alerta-bg:#fdf3d9;
  --neutro:#1c4a50; --neutro-bg:#f2f2f2; /* neutral-100, surface-chrome */
  --doc:#1c4a50;    --doc-bg:#f2f2f2;
  --config:#0f7a3d; --config-bg:#d2edd7;
  --norma:#6b3fa0;  --norma-bg:#f0eaf9;
  --infer:#828385;  --infer-bg:#f2f2f2;

  --radio:12px;              /* radius-s */
  --radio-pill:999px;        /* radius-pill */
  --sombra:0 2px 24px rgba(9,53,59,.05);   /* shadow-card */
}
:root[data-tema="linko"] body{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
:root[data-tema="linko"] .mini,
:root[data-tema="linko"] .det{ box-shadow:var(--sombra); border-radius:20px; }
:root[data-tema="linko"] .top{ box-shadow:0 4px 30px rgba(9,53,59,.06); }
:root[data-tema="linko"] button,
:root[data-tema="linko"] select,
:root[data-tema="linko"] input{ border-radius:999px; padding-left:14px; padding-right:14px; }
:root[data-tema="linko"] .badge,
:root[data-tema="linko"] .chip,
:root[data-tema="linko"] .flag{ border-radius:999px; }
:root[data-tema="linko"] .marca{ color:#09353b; }
:root[data-tema="linko"] .aviso{ background:#fdf3d9; }

/* ===== Tema OSCURO forzado (independiente del sistema) ===================== */
:root[data-tema="oscuro"]{
  --bg:#14171a; --panel:#1c2024; --linea:#2e343b; --texto:#e8eaed; --suave:#9aa3ad;
  --ok:#5bd18f; --ok-bg:#12301f; --mal:#ff8a80; --mal-bg:#3a1614;
  --alerta:#ffd166; --alerta-bg:#3a2f10; --neutro:#b0b8c1; --neutro-bg:#252b31;
  --doc:#7db3ea; --doc-bg:#16283d; --config:#5bd18f; --config-bg:#12301f;
  --norma:#c0a6f0; --norma-bg:#251c38; --infer:#9aa3ad; --infer-bg:#252b31;
  --acento:#7db3ea;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
a{color:var(--acento)}
/* barra superior */
.top{position:sticky;top:0;z-index:15;background:var(--panel);border-bottom:1px solid var(--linea);
  padding:12px 20px;display:flex;align-items:center;gap:14px}
.ham{font-size:20px;line-height:1;background:none;border:1px solid var(--linea);border-radius:8px;
  padding:5px 11px;cursor:pointer;color:var(--texto)}
.ham:hover{border-color:var(--acento)}
.marca{font-weight:700;font-size:15px;cursor:pointer}
.migas{color:var(--suave);font-size:13px}
.top .der{margin-left:auto;display:flex;gap:8px;align-items:center}
button,select,input{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--linea);
  border-radius:7px;background:var(--panel);color:var(--texto)}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--acento)}
button:disabled{opacity:.55;cursor:not-allowed}
.aviso{margin:0;padding:9px 20px;border-bottom:1px solid var(--linea);
  background:var(--alerta-bg);font-size:12.5px}
/* menu lateral */
#menu{position:fixed;left:0;top:0;bottom:0;width:min(300px,84%);background:var(--panel);
  border-right:1px solid var(--linea);z-index:30;transform:translateX(-102%);
  transition:transform .18s ease;overflow-y:auto;box-shadow:6px 0 26px rgba(0,0,0,.16)}
#menu.on{transform:none}
#velo{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:25;display:none}
#velo.on{display:block}
#menu h3{margin:0;padding:14px 16px;font-size:12px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--suave);border-bottom:1px solid var(--linea)}
.cat{padding:11px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--suave);font-weight:700}
.mi{display:flex;align-items:center;gap:8px;padding:7px 16px;cursor:pointer;font-size:13.5px}
.mi:hover{background:var(--neutro-bg)}
.mi.sel{background:var(--doc-bg);color:var(--doc);font-weight:600}
.mi .pt{margin-left:auto;font-size:11.5px;color:var(--suave);font-variant-numeric:tabular-nums}
main{padding:20px;max-width:1500px;margin:0 auto}
/* galeria */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.mini{background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:14px;
  cursor:pointer;display:flex;flex-direction:column;gap:9px}
.mini:hover{border-color:var(--acento)}
.mini h3{margin:0;font-size:14px;display:flex;gap:7px;align-items:flex-start}
.mini .cat-chip{font-size:10.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.04em}
.badge{font-size:10.5px;padding:2px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
.b-validado{background:var(--ok-bg);color:var(--ok)}
.b-parcial{background:var(--alerta-bg);color:var(--alerta)}
.b-bloqueado{background:var(--mal-bg);color:var(--mal)}
.b-sin_cruce{background:var(--neutro-bg);color:var(--neutro)}
.b-corrida_local{background:var(--ok-bg);color:var(--ok)}
.b-dossier{background:var(--doc-bg);color:var(--doc)}
.pct{display:flex;align-items:center;gap:10px}
.sinpct{background:var(--config-bg);color:var(--texto);border-left:3px solid var(--config);
  padding:10px 13px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.5}
.mini .sinpct{font-size:11.5px;padding:8px 10px}
.pct .val{font-size:21px;font-weight:700;min-width:82px;font-variant-numeric:tabular-nums}
.riel{flex:1;height:7px;background:var(--neutro-bg);border-radius:99px;overflow:hidden}
.riel i{display:block;height:100%;background:var(--ok)}
.riel.medio i{background:var(--alerta)} .riel.malo i{background:var(--mal)}
/* detalle */
.det{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:20px;
  display:flex;flex-direction:column;gap:15px;max-width:1050px;margin:0 auto}
.det h2{margin:0;font-size:19px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
pre.formula{margin:0;padding:12px 14px;background:var(--neutro-bg);border-radius:7px;
  font-size:12.5px;overflow-x:auto;white-space:pre;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600}
.chip small{font-weight:400;opacity:.85}
.c-doc{background:var(--doc-bg);color:var(--doc)}
.c-config{background:var(--config-bg);color:var(--config)}
.c-norma{background:var(--norma-bg);color:var(--norma)}
.c-inferencia{background:var(--infer-bg);color:var(--infer);border:1px dashed currentColor}
.conteo{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--suave)}
.conteo b{color:var(--texto);font-size:16px;display:block;font-variant-numeric:tabular-nums}
.conteo .malo b{color:var(--mal)}
.sec{border-top:1px solid var(--linea);padding-top:13px}
.sec h3{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--suave);display:flex;align-items:center;gap:7px}
/* tres granularidades */
.gran{display:flex;flex-direction:column;gap:7px}
.g{display:flex;align-items:center;gap:11px;font-size:12.5px}
.g .et{width:66px;font-weight:600;font-family:ui-monospace,monospace}
.g .n{width:112px;text-align:right;color:var(--suave);font-variant-numeric:tabular-nums}
.g .p{width:64px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.escalon{font-size:12.5px;background:var(--neutro-bg);padding:9px 12px;border-radius:7px;line-height:1.5}
.flag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.umbral{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
  background:var(--neutro-bg);color:var(--suave);border:1px solid var(--linea);white-space:nowrap}
.corte{font-size:11.5px;color:var(--suave)}
.superada{background:var(--alerta-bg,var(--neutro-bg));border-left:3px solid var(--alerta);
  padding:9px 12px;border-radius:5px;font-size:12.5px;line-height:1.55;margin:8px 0}
.crit{border:1px solid var(--linea);border-radius:8px;padding:10px 13px;margin-bottom:9px;font-size:12.5px}
.crit h4{margin:0 0 5px;font-size:13px;display:flex;gap:9px;align-items:baseline}
.crit .dest{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.crit .dest a{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ok-bg);
  color:var(--ok);text-decoration:none;cursor:pointer;font-weight:700}
.crit .dest .doc{background:var(--neutro-bg);color:var(--suave);font-weight:400}
table.glos{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
table.glos th,table.glos td{border:1px solid var(--linea);padding:6px 9px;text-align:left;vertical-align:top}
table.glos th{background:var(--neutro-bg);font-weight:700}
.md{line-height:1.65}
.alcance{border:1px solid var(--linea);border-radius:9px;padding:12px 14px;font-size:12.5px;line-height:1.6}
.alcance .fila{display:flex;gap:10px;margin-bottom:5px}
.alcance .et{color:var(--suave);min-width:132px;flex-shrink:0}
.alcance ul{margin:3px 0 0 16px;padding:0}
.alcance li{margin-bottom:3px}
.alcance .no{color:var(--mal)}
.alcance .ojo{background:var(--alerta-bg,var(--neutro-bg));border-left:3px solid var(--alerta);
  padding:8px 11px;border-radius:5px;margin-top:9px}
.repr{font-weight:700}
.sanidad{border:1px solid var(--linea);border-radius:10px;padding:13px 15px;margin-bottom:18px}
.sanidad.mal{border-color:var(--mal);background:var(--mal-bg)}
.sanidad.bien{border-color:var(--ok)}
.sanidad h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:9px}
.sanidad .inv{font-size:12px;margin-top:7px;line-height:1.55}
.sanidad .inv code{font-weight:700}
.sanidad .viol{color:var(--mal);margin-left:16px;display:block}
.sanidad .abrir{margin-left:auto;font-size:11.5px;cursor:pointer;color:var(--suave);
  text-decoration:underline;font-weight:400}
.flag.ok{background:var(--ok-bg);color:var(--ok)}
.flag.mal{background:var(--mal-bg);color:var(--mal)}
.ayuda{border:1px solid var(--linea);border-radius:50%;width:17px;height:17px;font-size:11px;
  line-height:15px;text-align:center;cursor:help;color:var(--suave)}
/* scatter */
.wrap-sc{position:relative}
canvas{width:100%;height:250px;display:block;border:1px solid var(--linea);border-radius:7px;
  background:var(--panel);cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--texto);color:var(--panel);
  padding:6px 9px;border-radius:6px;font-size:11.5px;white-space:pre;z-index:9;display:none}
.ctrl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--suave)}
.ctrl label{display:flex;gap:5px;align-items:center;cursor:pointer}
table.nc{width:100%;border-collapse:collapse;font-size:11.5px}
table.nc td{padding:4px 7px 4px 0;border-bottom:1px solid var(--linea)}
table.nc td.d{color:var(--mal);font-weight:700;text-align:right}
.exp{font-size:13px;color:var(--suave);line-height:1.55}
.exp strong{color:var(--texto)}
.bloq{background:var(--mal-bg);border-left:3px solid var(--mal);padding:10px 13px;
  border-radius:0 7px 7px 0;font-size:12.5px}
.sol{display:inline-block;background:var(--neutro-bg);color:var(--neutro);padding:1px 7px;
  border-radius:4px;font-size:11px;font-weight:700;margin-right:4px}
.cita{font-size:11.5px;color:var(--suave)}
/* ejecutar */
.exec{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spin{width:14px;height:14px;border:2px solid var(--linea);border-top-color:var(--acento);
  border-radius:50%;display:inline-block;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.prog{flex:1;min-width:130px;height:6px;background:var(--neutro-bg);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acento);transition:width .3s}
/* chat */
#chat{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--panel);
  border-left:1px solid var(--linea);display:none;flex-direction:column;z-index:40}
#chat.on{display:flex}
#chat .ch{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--linea)}
#log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{font-size:13.5px;line-height:1.55}
.msg.yo{align-self:flex-end;background:var(--acento);color:#fff;padding:8px 12px;
  border-radius:12px 12px 2px 12px;max-width:85%}
.msg.bot{background:var(--neutro-bg);padding:10px 13px;border-radius:12px 12px 12px 2px}
.msg.bot pre{white-space:pre-wrap;font-size:11.5px;margin:6px 0;background:var(--panel);
  padding:8px;border-radius:5px;overflow-x:auto}
#entrada{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--linea)}
#entrada input{flex:1}
.sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.sug button{font-size:11.5px;padding:4px 9px;color:var(--suave)}
</style>
</head>
<body>

<div class="top">
  <button class="ham" id="b-menu" title="casos por categoría">☰</button>
  <span class="marca" onclick="ir('#/')">Auditor independiente — motor C</span>
  <span class="migas" id="migas"></span>
  <span class="der">
    <select id="tema" title="apariencia del tablero">
      <option value="auto">Auto (sistema)</option>
      <option value="linko">Linko</option>
      <option value="oscuro">Oscuro</option>
    </select>
    <button id="b-todo">Ejecutar todo</button>
    <button id="b-chat">Agente</button>
  </span>
</div>
<div class="aviso"><strong>Verde no es aprobado.</strong> Cada porcentaje sale de una validación que
devuelve <em>las filas que violan la regla</em>. El dictamen lo emite el humano.</div>

<div id="velo"></div>
<nav id="menu"><h3>Casos por categoría</h3><div id="menu-cuerpo"></div></nav>

<main id="vista"></main>

<div id="chat">
  <div class="ch"><strong>Agente — explica los motores</strong>
    <button onclick="document.getElementById('chat').classList.remove('on')">cerrar</button></div>
  <div id="log"></div>
  <div class="sug" id="sug"></div>
  <div id="entrada"><input id="q" placeholder="¿cómo se calcula el moratorio?" autocomplete="off">
    <button id="enviar">Enviar</button></div>
</div>

<script src="datos.js"></script>
<script>
const D=window.DATOS, MOT=D.motores, IDX=D.indice, CONO=D.conocimiento;
const API = location.protocol.startsWith('http');   // sin servidor, "Ejecutar" no aplica

const ORIGEN={corrida_local:["Calculado aquí","El % lo computó esta máquina contra la base."],
  dossier:["Citado del dossier","Lo reporta el DOSSIER de una corrida previa. Este tablero NO lo recalculó."],
  sin_cruce:["Sin cruce","Hay fórmula y autoprueba, pero no hay cruce contra datos. No es un pase."]};
const AYUDA_GRAN=`Las tres granularidades y cómo leer el escalón:

1e-8  exactitud aritmética estricta. Si cuadra aquí es el MISMO cálculo que
      el core, sin diferencia perceptible. Es la prueba más dura.
1e-5  precisión intermedia. Absorbe ruido de acumulación y orden de
      operaciones, pero NO tolera un centavo.
0.01  tolerancia de negocio. Lo que le importa al cliente y a la contabilidad.

El escalón dice más que cualquier número solo:
· 100/100/100          cuadre exacto, mismo motor bit a bit.
· bajo a 1e-8, alto al centavo  residuo sub-centavo = granularidad del
  snapshot, NO defecto.
· bajo también al centavo       diferencia material que investigar.

Y al centavo no basta: sobre el residuo fuera de 1e-8 se corre una prueba de
signo. Si las diferencias se cargan a un lado es sesgo sistemático, severidad 1
aunque cada una sea de un centavo. Verde al centavo CON sesgo no es aprobado.`;

/* Como se lee la escala del titular. `volumen` NO es una granularidad: es el
   porcentaje de un cruce 1-a-1 masivo, y decir "al 1e-8" seria inventarle una
   precision que no tiene. */
const ETIQUETA_ESCALA=e=>({
  'centavo':'al <span class="mono">centavo</span> — tolerancia de negocio',
  '1e-5':'a <span class="mono">1e-5</span> — precisión intermedia',
  '1e-8':'a <span class="mono">1e-8</span> — exactitud aritmética estricta',
  'volumen':'del <strong>cruce a volumen</strong> — no es una granularidad',
  'completitud':'de <strong>completitud</strong> — identidad exacta, no admite holgura',
  'config':'contra la <strong>configuración del core</strong> — no es una cohorte',
  'sin escala declarada':'<strong>sin escala declarada</strong> — falta su fila en la matriz'
}[e]||esc(e));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=s=>{const v=parseFloat(s);return isFinite(v)?v:null;};
const clase=p=>p===null?"":(p>=99.5?"":(p>=90?"medio":"malo"));
const fmt=n=>n==null?"—":Number(n).toLocaleString('es-MX');

/* ---------- scatter ---------- */
function dibujar(cv,pts,opt){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.body),cL=cs.getPropertyValue('--linea'),
    cS=cs.getPropertyValue('--suave'),cO=cs.getPropertyValue('--ok'),cM=cs.getPropertyValue('--mal');
  let vis=pts.filter(p=>p.delta!==null);
  if(opt.soloNC) vis=vis.filter(p=>!conf(p,opt.tol));
  const M={l:62,r:12,t:14,b:26},W=w-M.l-M.r,H=h-M.t-M.b;
  if(!vis.length){g.fillStyle=cS;g.font="12px sans-serif";g.textAlign="center";
    g.fillText(opt.soloNC?"Sin no conformes con esta tolerancia":"Sin puntos comparables",w/2,h/2);
    return {pos:[]};}
  const xs=vis.map(p=>p.x),ys=vis.map(p=>Math.abs(num(p.delta)||0));
  let x0=Math.min(...xs),x1=Math.max(...xs); if(x1===x0)x1=x0+1;
  const yM=Math.max(...ys,(num(opt.tol)||0)*2,1e-9);
  const eX=v=>opt.log?(M.l+(Math.log10(Math.max(v,1e-9))-Math.log10(Math.max(x0,1e-9)))/
      ((Math.log10(Math.max(x1,1e-9))-Math.log10(Math.max(x0,1e-9)))||1)*W)
    :(M.l+(v-x0)/((x1-x0)||1)*W);
  const eY=v=>M.t+H/2-(v/yM)*(H/2);
  const tol=num(opt.tol)||0;
  if(tol>0){g.fillStyle=cO;g.globalAlpha=.11;g.fillRect(M.l,eY(tol),W,eY(-tol)-eY(tol));g.globalAlpha=1;}
  g.strokeStyle=cL;g.beginPath();g.moveTo(M.l,eY(0));g.lineTo(M.l+W,eY(0));g.stroke();
  g.fillStyle=cS;g.font="10px sans-serif";g.textAlign="right";
  g.fillText("0",M.l-6,eY(0)+3);g.fillText(yM.toPrecision(2),M.l-6,M.t+8);
  g.fillText("-"+yM.toPrecision(2),M.l-6,M.t+H-2);
  g.textAlign="center";g.fillText(opt.ejes.eje_x||"",M.l+W/2,h-7);
  const pos=[];
  for(const p of vis.slice().sort((a,b)=>(conf(a,opt.tol)?0:1)-(conf(b,opt.tol)?0:1))){
    const ok=conf(p,opt.tol),X=eX(p.x),Y=eY(num(p.delta)||0);
    g.beginPath();g.arc(X,Y,ok?2.3:4.5,0,7);
    g.fillStyle=ok?cO:cM;g.globalAlpha=ok?.32:.95;g.fill();
    if(!ok){g.globalAlpha=1;g.strokeStyle=cM;g.stroke();}
    g.globalAlpha=1;pos.push({x:X,y:Y,p,ok});
  }
  return {pos};
}
const conf=(p,tol)=>Math.abs(num(p.delta)||0)<=(num(tol)||0);

/* Qué respalda a un motor cuando NO hay porcentaje.

   Un % ausente no es cobertura ausente. Hay motores cuya prueba es MAS FUERTE
   que un porcentaje —reproducir la configuración real del core no depende de
   qué cohorte se elija— y otros cuya única prueba es la autoprueba de la
   fórmula. Tratarlos igual subreporta al primero y sobrevende al segundo, así
   que la tarjeta dice cuál de los dos es, por jerarquía de evidencia:
   config > norma > doc > inferencia > sólo autoprueba. */
function respaldo(m, largo){
  const de = t => (m.valida_contra||[]).filter(f=>f.tipo===t);
  const citas = a => a.map(f=>esc(f.cita)).join(' · ');
  let cabeza, cuerpo='';

  // Se decide por `cobertura`, que calcula el BACKEND, no por si hay % ni por
  // inspeccionar los chips: es una afirmación sobre la evidencia, no una
  // decisión de presentación (§3.2).
  if(m.cobertura==='config'){
    cabeza='Validado contra la <em>configuración real de AurumCore</em>';
    cuerpo=esc(m.evidencia_config||'')||citas(de('config'));
    if(largo) cuerpo+=`<br><span class="cita">Una configuración no es una cohorte, por eso no hay
      porcentaje — y eso <strong>no es falta de validación</strong>. De hecho es más fuerte que un %:
      un porcentaje depende de qué cohorte elegiste, y la configuración no.</span>`;
  } else if(m.cobertura==='sin_cruce'){
    const nor=de('norma'), doc=de('doc'), inf=de('inferencia');
    if(nor.length){ cabeza='Contrastado contra la <em>norma</em>'; cuerpo=citas(nor); }
    else if(doc.length){ cabeza='Contrastado contra el <em>documento oficial</em>'; cuerpo=citas(doc); }
    else if(inf.length){ cabeza='Mecánica <em>deducida de los datos</em> — por confirmar'; cuerpo=citas(inf); }
    else { cabeza='Sin cobertura'; cuerpo=''; }
    cuerpo += `<br><span class="cita">No hay cruce contra datos desde este tablero.
      <strong>Eso no es un pase.</strong></span>`;
  } else if(m.cobertura==='volumen'){
    cabeza='Cruce <em>a volumen</em>';
    cuerpo=citas(de('doc'))||citas(de('config'));
    cuerpo+=`<br><span class="cita">Un cruce a volumen cuenta contratos que empatan,
      no decimales que coinciden: <strong>no es una granularidad</strong> y no se lee
      como precisión aritmética.</span>`;
  } else if(m.cobertura==='completitud'){
    cabeza='Identidad de <em>completitud</em>';
    cuerpo=citas(de('config'))||citas(de('doc'));
  } else {
    cabeza='Con cobertura de datos'; cuerpo=citas(de('config'))||citas(de('doc'));
  }
  let extra='';
  if(m.tolerancia_propia) extra+=`<br><span class="cita">Tolerancia propia:
    <span class="mono">${esc(m.tolerancia_propia.regla)}</span> — ${esc(m.tolerancia_propia.porque)}</span>`;
  if(largo && m.dossier_detalle) extra+=`<br><span class="cita">${esc(m.dossier_detalle)}</span>`;
  return `<div class="sinpct"><strong>${cabeza}</strong><br>${cuerpo}${extra}</div>`;
}

/* ---------- sanidad del propio tablero ----------
   El tablero se audita con la misma vara que aplica al core: cada invariante
   DEVUELVE las cards que lo violan, 0 = pasa. Va en el home y no en un rincón,
   porque un status de sanidad escondido no es un status. Ver NORTE_SANIDAD.md. */
let SAN_ABIERTO=false;
function panelSanidad(){
  const s=IDX.sanidad; if(!s) return '';
  const sano=s.status==='SANO', fals=s.falsabilidad||{};
  // Verde global = 0 violaciones en TODOS los invariantes. No hay "casi sano":
  // si la auto-prueba de falsabilidad falla, los invariantes no prueban nada y
  // el verde sería tan vacío como el all-pass que este tablero existe para evitar.
  const ok=sano&&fals.ok;
  const detalle=SAN_ABIERTO?`<div class="inv">
      ${(s.invariantes||[]).map(i=>`<div>
        <span class="badge b-${i.n?'bloqueado':'validado'}">${i.n?i.n+' ✗':'ok'}</span>
        <code>${esc(i.id)}</code> ${esc(i.afirma)}
        ${(i.violaciones||[]).map(v=>`<span class="viol">→ ${esc(v.motor)}: ${esc(v.detalle)}</span>`).join('')}
      </div>`).join('')}
      ${(s.avisos_upstream||[]).length?`<div style="margin-top:9px">
        <strong>Aguas arriba</strong> — el tablero muestra lo más nuevo; la fuente va atrás:
        ${s.avisos_upstream.map(a=>`<span class="viol" style="color:var(--suave)">→
          ${esc(a.motor)}: ${esc(a.detalle)}</span>`).join('')}</div>`:''}
      <div style="margin-top:9px">
        <strong>Auto-prueba de falsabilidad</strong> — un invariante que no atrapa el engaño
        que lo motivó no prueba nada:
        ${(fals.casos||[]).map(c=>`<span class="viol" style="color:${c.atrapado?'var(--ok)':'var(--mal)'}">
          ${c.atrapado?'✔ atrapado':'✗ NO atrapado'} — ${esc(c.bug)}
          ${c.por?'['+esc(c.por.join(', '))+']':''}</span>`).join('')}
      </div>
      <div style="margin-top:9px;color:var(--suave)">${esc(s.regla||'')}</div>
    </div>`:'';
  return `<div class="sanidad ${ok?'bien':'mal'}">
    <h4><span class="badge b-${ok?'validado':'bloqueado'}">${ok?'SANO':'NO SANO'}</span>
      Sanidad del tablero — ${s.n_violaciones} violación(es) en ${(s.invariantes||[]).length}
      invariantes sobre ${s.n_motores} motores
      <span class="abrir" onclick="ir('#/criterios')">criterios de auditoría</span>
      <span class="abrir" onclick="ir('#/glosario')">glosario de estados</span>
      <span class="abrir" onclick="SAN_ABIERTO=!SAN_ABIERTO;pintar()">${SAN_ABIERTO?'ocultar':'ver detalle'}</span>
    </h4>
    ${!fals.ok?`<div class="inv" style="color:var(--mal)"><strong>La auto-prueba de
      falsabilidad falla:</strong> los invariantes no atrapan los engaños que los
      motivaron, así que este status no significa nada.</div>`:''}
    ${detalle}</div>`;
}

/* ---------- alcance: que se toma y que NO ----------
   Un porcentaje sin su universo no se puede leer. Un 100% sobre un cohorte que
   es el 39.6% del libro y un 100% sobre el libro entero son afirmaciones muy
   distintas, y la tarjeta las mostraba igual. Fuente: el INFORME DETALLADO. */
const TIPO_ALCANCE=t=>{
  const k=String(t||'').toLowerCase();
  if(k.startsWith('censo')) return ['censo','Se tomó el <strong>100%</strong> de un alcance bien definido. No extrapola porque no hace falta: dentro de ese alcance no quedó nada fuera.'];
  if(k.startsWith('muestra')) return ['muestra','Selección <strong>parcial</strong>. Para extrapolar haría falta declarar el método de muestreo.'];
  if(k.startsWith('bloqueado')) return ['bloqueado','No hay alcance que declarar: falta el insumo.'];
  return ['subconjunto','Recorte con <strong>rationale</strong> declarado (metodológico o de performance), no muestreo estadístico.'];
};
function bloqueAlcance(m){
  const a=m.alcance; if(!a) return '';
  const [et,expl]=TIPO_ALCANCE(a.tipo);
  return `<div class="sec"><h3>Alcance — qué se toma y qué no</h3><div class="alcance">
    <div class="fila"><span class="et">Sí se valida</span><span>${esc(a.si)}</span></div>
    <div class="fila"><span class="et">NO se valida</span><span><ul>${
      (a.no||[]).map(x=>`<li class="no">${esc(x)}</li>`).join('')}</ul></span></div>
    <div class="fila"><span class="et">Tipo</span><span><span class="badge b-${
      et==='censo'?'validado':(et==='bloqueado'?'bloqueado':'parcial')}">${esc(a.tipo)}</span>
      <span class="cita"> ${expl}</span></span></div>
    <div class="fila"><span class="et">Comparado</span><span>${esc(a.n)}</span></div>
    <div class="fila"><span class="et">De un universo de</span><span>${esc(a.universo)}</span></div>
    <div class="fila"><span class="et">Representatividad</span><span class="repr">${esc(a.representatividad)}</span></div>
    <div class="fila"><span class="et">Por qué ese recorte</span><span>${esc(a.rationale)}</span></div>
    ${a.nota?`<div class="ojo"><strong>Ojo:</strong> ${esc(a.nota)}</div>`:''}
    <div class="cita" style="margin-top:9px">Citado de <span class="mono">${esc(a.ref)}</span>.
      Los denominadores los midió el repo de validación contra la base; este tablero no los ha reproducido.</div>
  </div></div>`;
}

/* ---------- vista: detalle ---------- */
function detalle(id){
  const m=MOT[id]; if(!m) return '<div class="exp">No existe ese motor.</div>';
  const cr=(m.cruce&&m.cruce.origen_resultado==='corrida_local')?m.cruce:null;
  const p=num(m.pct_mostrado),[et,ex]=ORIGEN[m.origen_resultado];
  document.getElementById('migas').textContent=`· ${m.categoria} · ${m.nombre}`;

  const chips=m.valida_contra.map(f=>`<span class="chip c-${f.tipo}" title="${esc(f.significado)}">${f.tipo}<small> · ${esc(f.cita)}</small></span>`).join('');

  // --- tres granularidades, o tolerancia propia si es motor de identidad ---
  let gran='';
  if(m.tolerancia_propia){
    gran=`<div class="sec"><h3>Cuadre</h3>
      <div class="escalon"><strong>Tolerancia propia: <span class="mono">${esc(m.tolerancia_propia.regla)}</span></strong><br>
      ${esc(m.tolerancia_propia.porque)}<br><br>
      <em>No se muestran las tres granularidades: este motor no compara dos importes calculados,
      así que un escalón de precisión no significaría nada aquí.</em></div></div>`;
  } else if(cr&&cr.match){
    const M=cr.match,e={};M.escalas.forEach(x=>e[x.nombre]=x);
    const p8=num(e['1e-8'].pct),pc=num(e['centavo'].pct);
    let lectura;
    // Si el motor DECLARA la lectura de su escalón, esa gana. La plantilla de
    // abajo vale para casi todos los motores y para alguno es falsa; aplicarla
    // a ciegas sería afirmar un diagnóstico que nadie verificó — la misma
    // fabricación que los invariantes persiguen, pero en la prosa.
    if(m.lectura_escalon) lectura=`<strong>Lectura de este motor:</strong> ${esc(m.lectura_escalon)}`;
    else if(p8>=99.995) lectura=`<strong>Cuadre exacto.</strong> Coincide a 8 decimales: es el mismo cálculo que el core, bit a bit. Es la lectura más fuerte posible.`;
    else if(pc-p8>=5) lectura=`<strong>Escalón ${e['1e-8'].pct}% → ${e['centavo'].pct}%.</strong> La lectura <em>habitual</em> de un escalón ancho es residuo sub-centavo — granularidad del snapshot, no defecto del motor. Este motor no la ha declarado, así que <em>hay que verificarla en el detalle del caso</em> antes de darla por buena.`;
    else if(pc<95) lectura=`<strong>Baja también al centavo (${e['centavo'].pct}%):</strong> hay diferencia <em>material</em> que investigar — defecto, linaje o dato faltante.`;
    else lectura=`El escalón entre granularidades es pequeño: el residuo no es sólo de redondeo.`;
    const sg=M.sesgo;
    gran=`<div class="sec"><h3>Cuadre en tres granularidades
        <span class="ayuda" title="${esc(AYUDA_GRAN)}">?</span></h3>
      <div class="gran">${M.escalas.map(x=>{const v=num(x.pct);return `<div class="g">
        <span class="et">${x.nombre}</span>
        <span class="riel ${clase(v)}"><i style="width:${v}%"></i></span>
        <span class="p">${x.pct}%</span>
        <span class="n">${fmt(x.n_ok)}/${fmt(x.n)}</span></div>`;}).join('')}</div>
      <div class="escalon" style="margin-top:10px">${lectura}<br><br>
        <span class="flag ${sg.sesgo_detectado?'mal':'ok'}">${sg.sesgo_detectado?'SESGO SISTEMÁTICO — severidad 1':'sin sesgo'}</span>
        <span class="cita"> ${esc(sg.lectura)} · fuera de 1e-8: ${fmt(sg.n_fuera_1e8)} (+${fmt(sg.n_pos)}/−${fmt(sg.n_neg)}), z=${sg.z} · |Δ| máx ${esc(M.max_abs_delta)}</span>
      </div></div>`;
  } else if(cr){
    gran=`<div class="sec"><h3>Cuadre en tres granularidades</h3>
      <div class="escalon">${esc(cr.match_nota||'Sin pares comparables.')}</div></div>`;
  } else if(m.dossier_match){
    // Motor CITADO: las tres escalas salen de MATRIZ_TOLERANCIAS.md, no de una
    // corrida propia. Se muestran igual, marcadas como citadas: un solo número
    // sin su escala es lo que hacía ver al moratorio como si fallara 1 de cada 5.
    const M=m.dossier_match;
    const escalas=['1e-8','1e-5','centavo'].concat(M.volumen?['volumen']:[]);
    const filas=escalas.map(k=>{
      const v=M[k]?num(M[k]):null;
      return `<div class="g"><span class="et">${k}</span>
        ${v===null?`<span class="riel" style="opacity:.35"></span><span class="p">[PEND]</span>`
                  :`<span class="riel ${clase(v)}"><i style="width:${v}%"></i></span><span class="p">${M[k]}%</span>`}
        <span class="n">${k===m.pct_escala?'← titular':''}</span></div>`;}).join('');
    const p8=M['1e-8']?num(M['1e-8']):null, pc=M['centavo']?num(M['centavo']):null;
    let lectura='';
    if(p8!==null && pc!==null && pc-p8>=5)
      lectura=`<strong>El escalón ${M['1e-8']}% → ${M['centavo']}% es diagnóstico:</strong> el residuo
        es sub-centavo, o sea granularidad del snapshot, <em>no defecto del motor</em>.`;
    else if(p8!==null && p8>=99.5) lectura='<strong>Cuadre exacto</strong> a 8 decimales.';
    else lectura='Las escalas marcadas <span class="mono">[PEND]</span> no se han computado todavía.';
    gran=`<div class="sec"><h3>Cuadre en tres granularidades
        <span class="ayuda" title="${esc(AYUDA_GRAN)}">?</span></h3>
      <div class="gran">${filas}</div>
      <div class="escalon" style="margin-top:10px">${lectura}
        ${M.nota?`<br><span class="cita">${esc(M.nota)}</span>`:''}
        <br><span class="cita"><strong>Citado</strong> de MATRIZ_TOLERANCIAS.md
        (n = ${esc(M.n||'—')}${M.sesgo?` · sesgo: ${esc(M.sesgo)}`:''}). Este tablero NO lo recalculó.</span>
      </div></div>`;
  }

  const conteo=cr?`<div class="conteo">
      <div><b>${fmt(cr.n_comparadas)}</b>comparadas</div>
      <div><b>${fmt(cr.n_ok)}</b>conformes</div>
      <div class="${cr.n_no_conformes?'malo':''}"><b>${fmt(cr.n_no_conformes)}</b>no conformes</div>
      <div><b>${esc(cr.tolerancia)}</b>tolerancia</div>
      ${cr.conformes_omitidos?`<div><b>${fmt(cr.conformes_omitidos)}</b>conformes omitidos del gráfico</div>`:''}
    </div>`:(m.dossier_detalle?`<div class="exp">${esc(m.dossier_detalle)}</div>`:'');

  const tabla=(cr&&cr.no_conformes_detalle&&cr.no_conformes_detalle.length)?
    `<div class="sec"><h3>Peores diferencias de esta corrida</h3><table class="nc">`+
    cr.no_conformes_detalle.slice(0,12).map(q=>`<tr><td class="mono">${esc(q.id)}</td>
      <td class="mono">B ${esc(q.b??'—')}</td><td class="mono">C ${esc(q.c??'—')}</td>
      <td class="d mono">${esc(q.delta??'sin C')}</td></tr>`).join('')+`</table></div>`:'';

  // La bandera viene del indice y la calcula el backend consultando el catalogo:
  // un caso puede existir y aun asi no ser ejecutable hoy (consulta retirada,
  // insumo faltante). Ofrecer un boton que el backend va a rechazar seria
  // prometer una corrida que no puede pasar.
  const it=(IDX.motores.find(x=>x.id===m.id)||{});
  const puede = API && it.ejecutable===true;
  // El motivo lo redacta el backend (§3.2): un botón muerto sin explicación
  // hace pensar que el motor no se puede validar, cuando lo que falta es el caso.
  const razonBoton = !API
    ? 'Abre el tablero con el servidor (python backend/servidor.py) para ejecutar.'
    : (m.motivo_no_ejecutable || '');

  return `<div class="det">
    <h2>${esc(m.nombre)}
      <span class="badge b-${m.estado}" title="${esc(m.estado_significado)}">${m.estado.replace('_',' ')}</span>
      <span class="badge b-${m.origen_resultado==='corrida_local'?'corrida_local':(m.origen_resultado==='dossier'?'dossier':'sin_cruce')}"
        title="${esc(ex)}">${esc(et)}</span>
      <span class="cita" style="margin-left:auto">${esc(m.categoria)}</span></h2>

    ${p!==null?`<div class="pct"><span class="val">${p.toFixed(2)+'%'}</span>
      <span class="riel ${clase(p)}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></span>
      ${m.pct_escala?`<span class="cita">${ETIQUETA_ESCALA(m.pct_escala)}</span>`:''}</div>
      ${bloqueCorte(m)}`
    : respaldo(m,true)}
    ${bloqueUmbral()}
    ${bloqueSuperada(m)}

    <div class="exec">
      <button id="b-run" ${puede?'':'disabled'} data-motor="${m.id}">Ejecutar</button>
      <span id="run-estado" class="cita">${cr&&cr.ejecutado?`última corrida ${esc(cr.ejecutado)}`:(razonBoton?esc(razonBoton):'sin corridas')}</span>
      <button onclick="abrirChat('explícame ${esc(m.nombre)}')">Explicar</button>
    </div>

    <div class="sec"><h3>Fórmula</h3><pre class="formula">${esc(m.formula)}</pre>

    ${cr?`<div class="sec"><h3>Distribución de diferencias</h3>

    ${cr&&cr.evidencia?`<div class="cita mono">evidencia: ${esc(cr.evidencia)}${cr.reconstruido_de_evidencia?' (reconstruido, sin volver a consultar la base)':''}</div>`:''}

/* ---------- umbral de bloqueo, corte y corrida superada ----------
   El umbral $0.99 es la vara con la que el grupo auditoría va a leer estos
   números (F-032). Sin él, un "95.38% al centavo" no dice si algo es
   bloqueante. Ojo con la lectura fácil: estar por debajo del umbral no es
   "todo pasa" — su criterio exige además que el residuo esté EXPLICADO. */
function bloqueUmbral(){
  const u=(IDX.cobertura||{}).umbral_bloqueo; if(!u) return '';
  return `<div class="cita" style="margin:8px 0">
    <span class="umbral">umbral de bloqueo: $${esc(u.monto)} ${esc(u.moneda)}</span>
    ${esc(u.texto)} <em>${esc(u.lectura)}</em></div>`;
}
/* Un resultado nuevo no reemplaza uno en firme sin declararlo: corte, qué
   sustituye y por qué. */
function bloqueCorte(m){
  const d=m.dossier_match||{}; if(!d.corte&&!d.firme_anterior) return '';
  return `<div class="corte">
    ${d.corte?`corte declarado <strong>${esc(d.corte)}</strong>`:''}
    ${d.firme_anterior?` · sustituye a: ${esc(d.firme_anterior)}`:''}
    ${d.porque_cambio?`<br><em>${esc(d.porque_cambio)}</em>`:''}
    ${d.nota?`<br>${esc(d.nota)}`:''}</div>`;
}
/* Una corrida propia superada no se borra ni se publica como titular. */
function bloqueSuperada(m){
  const cr=m.cruce; if(!cr||!cr.superada) return '';
  return `<div class="superada"><strong>La corrida de este tablero quedó superada.</strong><br>
    ${esc(cr.superada_por||'')}<br>
    <span class="cita">Lo de abajo —conteo, granularidades, scatter y no conformes— es el
    <strong>preview</strong>, no la cifra en firme. Se conserva porque borrarlo perdería
    cobertura en silencio.</span></div>`;
}

/* ---------- criterios de hallazgo bloqueante (F-032) ----------
   El prompt de cierre pide que el material MAPEE cada observación de auditoría
   a dónde se atiende, y que el tablero lo haga navegable. */
const EST_CRIT={
  'cubierto':['validado','cubierto'],
  'cubierto-con-vigilancia':['validado','cubierto · con vigilancia'],
  'cubierto-con-pendiente':['parcial','cubierto · con pendiente'],
  'parcial':['parcial','parcial'],
  'levantado':['parcial','levantado como hallazgo'],
  'depende-de-terceros':['bloqueado','depende de terceros']};
function criterios(){
  document.getElementById('migas').textContent='· criterios de auditoría';
  const cs=(IDX.cobertura||{}).criterios_f032||[];
  const u=(IDX.cobertura||{}).umbral_bloqueo||{};
  const grupo=f=>cs.filter(c=>c.familia===f).map(c=>{
    const [cls,txt]=EST_CRIT[c.estado]||['parcial',c.estado];
    return `<div class="crit">
      <h4><span class="mono">${esc(c.id)}</span> ${esc(c.texto)}
        <span class="badge b-${cls}" style="margin-left:auto">${esc(txt)}</span></h4>
      <div>${esc(c.nota)}</div>
      <div class="dest">
        ${(c.motores||[]).map(id=>MOT[id]?`<a onclick="ir('#/${id}')">${esc(MOT[id].nombre)}</a>`:'').join('')}
        ${c.doc?`<span class="dest"><span class="doc">${esc(c.doc)}</span></span>`:''}
      </div></div>`;}).join('');
  return `<div class="sec"><h3>Dónde se atiende cada observación de auditoría</h3>
    <div class="cita">Los criterios de <span class="mono">F-032 · Criterios de Hallazgos
      Bloqueantes</span> (Auditoría Interna de Finsus) contra la cobertura de este oráculo.
      Cada uno enlaza al motor o documento que lo atiende.</div>
    <div class="cita" style="margin-top:8px"><span class="umbral">umbral de bloqueo:
      $${esc(u.monto||'0.99')} ${esc(u.moneda||'MXN')}</span> ${esc(u.texto||'')}</div>
    </div>
    <div class="sec"><h3>Las 7 condiciones de bloqueo</h3>${grupo('condicion')}</div>
    <div class="sec"><h3>Áreas de riesgo priorizadas</h3>${grupo('area')}</div>
    <div class="sec"><div class="cita">Estar por debajo del umbral <strong>no es "todo pasa"</strong>:
      el criterio de Finsus exige además que el residuo esté <strong>explicado</strong>. Eso es lo
      que hace cada card en su sección de no conformes.</div></div>`;
}

/* ---------- glosario ----------
   La "tablita de significados" que el grupo auditoría pidió en la sesión del
   28-ago. Se RENDERIZA desde `GLOSARIO_ESTADOS_TABLERO.md` del bundle, no se
   mantiene una copia de las definiciones aquí: dos glosarios se separan, y el
   que manda es el del bundle. */
function glosario(){
  document.getElementById('migas').textContent='· glosario de estados';
  const secs=(DATOS.conocimiento.secciones||[]).filter(s=>s.doc==='GLOSARIO');
  if(!secs.length) return `<div class="exp">El glosario no está en el corpus.
    Corre <span class="mono">python backend/runner.py</span> para regenerarlo.</div>`;
  return `<div class="sec"><h3>Qué significa cada etiqueta</h3>
    <div class="cita">Renderizado de <span class="mono">40_validaciones/GLOSARIO_ESTADOS_TABLERO.md</span>
      — la fuente es el bundle, no este tablero.</div></div>
    ${secs.map(x=>`<div class="sec"><h3>${esc(x.titulo)}</h3>
      <div class="exp md">${md(x.cuerpo)}</div></div>`).join('')}`;
}
/* Markdown mínimo: tablas, negritas, código y saltos. Suficiente para el
   glosario y sin traer una librería por CDN. */
function md(t){
  const filas=[]; let tabla=null;
  for(const ln of String(t).split('\n')){
    if(/^\s*\|/.test(ln)){
      const c=ln.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      if(c.every(x=>/^:?-{2,}:?$/.test(x))){ if(tabla) tabla.sep=true; continue; }
      if(!tabla){ tabla={cab:c,filas:[],sep:false}; }
      else tabla.filas.push(c);
    } else {
      if(tabla){ filas.push(tab(tabla)); tabla=null; }
      filas.push(ln.replace(/^>\s?/,''));   // las citas del .md se leen como texto
    }
  }
  if(tabla) filas.push(tab(tabla));
  return filas.join('\n')
    .replace(/^&gt;/gm,'')
    .replace(/\*\*([^*]+)\*\*/g,(m,x)=>'<strong>'+esc(x)+'</strong>')
    .replace(/`([^`]+)`/g,(m,x)=>'<span class="mono">'+esc(x)+'</span>')
    .replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
}
function tab(t){
  const cel=(c,e)=>`<${e}>${String(c).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<span class="mono">$1</span>')}</${e}>`;
  return `<table class="glos"><thead><tr>${t.cab.map(c=>cel(c,'th')).join('')}</tr></thead>
    <tbody>${t.filas.map(f=>`<tr>${f.map(c=>cel(c,'td')).join('')}</tr>`).join('')}</tbody></table>`;
}

/* ---------- detalle: scatter + ejecutar ---------- */
function cablearDetalle(id){
  const m=MOT[id],cr=(m.cruce&&m.cruce.origen_resultado==='corrida_local')?m.cruce:null;
  if(cr){
    const cv=document.getElementById('sc'),tip=document.getElementById('tip');
    const opt={soloNC:false,log:false,tol:cr.tolerancia,ejes:cr.ejes||{}};
    let st=null; const pinta=()=>{st=dibujar(cv,cr.puntos,opt);};
    document.getElementById('c-nc').onchange=e=>{opt.soloNC=e.target.checked;pinta();};
    document.getElementById('c-log').onchange=e=>{opt.log=e.target.checked;pinta();};
    document.getElementById('c-tol').oninput=e=>{opt.tol=e.target.value;pinta();};
    cv.onmousemove=ev=>{if(!st)return;const r=cv.getBoundingClientRect(),
      mx=ev.clientX-r.left,my=ev.clientY-r.top;let b=null,dm=225;
      for(const q of st.pos){const d=(q.x-mx)**2+(q.y-my)**2;if(d<dm){dm=d;b=q;}}
      if(b){tip.style.display='block';tip.style.left=Math.min(mx+12,cv.clientWidth-200)+'px';
        tip.style.top=Math.max(my-60,0)+'px';
        tip.textContent=`${b.p.id}\nB ${b.p.b??'—'}\nC ${b.p.c??'—'}\nΔ ${b.p.delta??'sin C'}`+
          (b.p.motivo?`\n${String(b.p.motivo).slice(0,58)}`:'')+(b.ok?'':'\n▲ NO CONFORME');
        cv.dataset.sel=b.p.id;}else tip.style.display='none';};
    cv.onmouseleave=()=>tip.style.display='none';
    cv.onclick=()=>abrirChat(`explícame el punto ${cv.dataset.sel||''} de ${m.nombre}`);
    new ResizeObserver(pinta).observe(cv); setTimeout(pinta,0);
  }
  const b=document.getElementById('b-run');
  if(b&&!b.disabled) b.onclick=()=>ejecutar(id,b);
}

/* ---------- ejecutar (contrato §2) ---------- */
async function ejecutar(id,boton){
  const est=document.getElementById('run-estado');
  boton.disabled=true;
  const prog=document.createElement('span');prog.className='prog';prog.innerHTML='<i style="width:0%"></i>';
  boton.after(prog);
  est.innerHTML='<span class="spin"></span> iniciando…';
  try{
    const r=await fetch(`/api/run/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({})});
    const j=await r.json();
    if(!r.ok){est.textContent=`no se puede ejecutar: ${j.mensaje||j.error}`;
      boton.disabled=false;prog.remove();return;}
    while(true){
      await new Promise(s=>setTimeout(s,900));
      const s=await (await fetch(`/api/job/${j.job_id}`)).json();
      prog.firstChild.style.width=(s.avance||0)+'%';
      est.innerHTML=`<span class="spin"></span> ${esc(s.mensaje||s.estado)}`;
      if(s.estado==='terminado'){
        est.innerHTML=`✔ terminó ${esc(s.terminado)} — ${esc(s.mensaje||'')}`;
        const nuevo=await (await fetch(`/api/resultado/${id}`)).json();
        MOT[id]=nuevo;
        const it=IDX.motores.find(x=>x.id===id);
        if(it){it.pct_mostrado=nuevo.pct_mostrado;it.origen_resultado=nuevo.origen_resultado;
               it.pct_escala=nuevo.pct_escala;it.cobertura=nuevo.cobertura;
               it.ejecutable=nuevo.ejecutable;}
        // Una corrida puede cambiar la escala o la cobertura de una tarjeta, así
        // que el status de sanidad se vuelve a pedir: dejar el badge en el valor
        // con que se cargó la página sería publicar un verde caducado (INV-C3).
        try{IDX.sanidad=await (await fetch('/api/sanidad')).json();}catch(e){}
        setTimeout(()=>{pintar();},700);
        break;
      }
      if(s.estado==='error'){est.textContent=`✖ error: ${s.mensaje}`;break;}
    }
  }catch(e){est.textContent='✖ no se pudo hablar con el backend: '+e.message;}
  boton.disabled=false;prog.remove();
}

/* ---------- agente ---------- */
const NORM=s=>s.toLowerCase().replace(/[áà]/g,'a').replace(/[éè]/g,'e').replace(/[íì]/g,'i')
  .replace(/[óò]/g,'o').replace(/[úù]/g,'u').replace(/ñ/g,'n');
const VACIAS=new Set(['el','la','los','las','de','del','que','como','se','un','una','y','o','a','en',
  'para','por','con','es','al','lo','me','mi','este','esta','cual','cuales','porque','explicame','explica','dime']);
const PESO={DOSSIER:3,NORTE:2,COMPARACION:2,SOLICITUDES:2,INDICE:1.5,TABLAS:1.5,'PIEZA-K':1.5};
function buscar(q,k=3){
  const t=NORM(q).split(/[^a-z0-9.\-]+/).filter(x=>x.length>2&&!VACIAS.has(x));
  if(!t.length)return[];
  return CONO.secciones.map(s=>{let p=0;
    for(const x of t){p+=(s.busqueda.split(x).length-1)+(NORM(s.titulo).includes(x)?12:0);}
    return{s,p:p*(PESO[s.doc]||1)};}).filter(r=>r.p>0).sort((a,b)=>b.p-a.p).slice(0,k);
}
function responder(q){
  const h=buscar(q);
  if(!h.length) return `<strong>No tengo respaldo para eso en el corpus.</strong><br>
    Sólo respondo con el dossier, el NORTE, el índice, la comparación, las solicitudes y las piezas K.
    Prefiero decirlo a improvisar una explicación.
    <div class="cita" style="margin-top:6px">Si es una regla que debería existir y no está, va como
    solicitud a Finsus (${esc((IDX.cobertura.solicitudes_abiertas||[]).join(', ')||'ver SOLICITUDES_FINSUS.md')}).</div>`;
  return h.map(x=>{const s=x.s,c=s.cuerpo.length>1400?s.cuerpo.slice(0,1400)+'\n…':s.cuerpo;
    return `<div><strong>${esc(s.titulo)}</strong><pre>${esc(c)}</pre>
      <div class="cita">fuente: ${esc(s.titulo_doc)} — <span class="mono">${esc(s.doc)}</span>, línea ${s.linea}</div></div>`;
  }).join('<hr style="border:0;border-top:1px solid var(--linea);margin:10px 0">');
}
function pon(t,q){const d=document.createElement('div');d.className='msg '+q;
  d.innerHTML=q==='yo'?esc(t):t;document.getElementById('log').appendChild(d);d.scrollIntoView({block:'end'});}
function preguntar(q){if(!q.trim())return;pon(q,'yo');pon(responder(q),'bot');document.getElementById('q').value='';}
function abrirChat(q){document.getElementById('chat').classList.add('on');if(q)preguntar(q);}

/* ---------- arranque ---------- */
/* El tema se guarda por navegador. El scatter lee los colores del CSS en cada
   dibujo, asi que al cambiar de tema hay que re-pintar: si no, los puntos
   quedan con la paleta anterior sobre el fondo nuevo. */
function aplicarTema(v){
  if(v==='auto') document.documentElement.removeAttribute('data-tema');
  else document.documentElement.setAttribute('data-tema',v);
  try{ localStorage.setItem('tema-auditor',v); }catch(e){}
  pintar();
}
(function(){
  let v='auto';
  try{ v=localStorage.getItem('tema-auditor')||'auto'; }catch(e){}
  const sel=document.getElementById('tema');
  sel.value=v;
  if(v!=='auto') document.documentElement.setAttribute('data-tema',v);
  sel.addEventListener('change',e=>aplicarTema(e.target.value));
})();

document.getElementById('b-todo').onclick=async()=>{
  if(!API){alert('Abre el tablero con el servidor para poder ejecutar:\n  python backend/servidor.py');return;}
  const ids=IDX.motores.filter(m=>m.ejecutable).map(m=>m.id);
  if(!ids.length){alert('Ningún motor tiene hoy un cruce ejecutable.');return;}
  if(!confirm(`Ejecutar ${ids.length} motor(es) contra la base, en solo lectura?\n\n${ids.join(', ')}`))return;
  for(const id of ids){
    try{const r=await fetch(`/api/run/${id}`,{method:'POST'});const j=await r.json();
      if(!r.ok){console.warn(id,j);continue;}
      while(true){await new Promise(s=>setTimeout(s,900));
        const s=await (await fetch(`/api/job/${j.job_id}`)).json();
        if(s.estado!=='en_ejecucion')break;}
      MOT[id]=await (await fetch(`/api/resultado/${id}`)).json();
    }catch(e){console.warn(id,e);}
  }
  pintar();
};
