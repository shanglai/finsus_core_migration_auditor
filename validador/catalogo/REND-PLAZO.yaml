id: REND-PLAZO
titulo: Rendimiento de inversion a plazo fijo al centavo, periodo a periodo
motor: DEV
dominio: DEV
regla_ref: [K-DEV-003, K-DEV-001]
severidad: 1
norte_ref: "NORTE_VALIDACION.md §1 DEV 2.1.2 — Rendimiento plazo fijo"
tolerancia: {tipo: redondeo, max_evento: "0.01", prueba_sesgo: true, alfa_sesgo: "0.01"}

parametros:
  - {nombre: cohorte, tipo: lista_cuentas, requerido: true, nota: "account_number '100-2301-X'"}
  - {nombre: fecha_ini, tipo: fecha, requerido: true, nota: "sobre payment_date"}
  - {nombre: fecha_fin, tipo: fecha, requerido: true, nota: "exclusiva"}
  - {nombre: delimitador, tipo: texto, requerido: true, default: "live",
     nota: "'migrado' (origin='FINSUS', confirma C=A) o 'live' (origin is null, confirma C=B). Son DOS experimentos distintos y no se mezclan."}
  - {nombre: dias_anio, tipo: decimal, default: "360",
     nota: "base del producto. En la muestra validada fueron 360 + dias reales de calendario."}
  - {nombre: tasa, tipo: decimal, requerido: false,
     nota: "si se omite, se despeja del periodo 1 (metodo de V5 / validate_plazo_origin.py)"}

extraccion:
  aurum: validador/extraccion/aurum/rend_plazo_universo.sql
  openfin: PENDIENTE

oraculo: oraculos/rendimientos.py::fila_rendimiento_plazo
universo: {fuente: aurum}

comparacion:
  tipo: igualdad_montos
  llaves: [cuenta, periodo]
  columna_b: rend_posteado
  columna_c: rend_oraculo
  fuente_b: aurum

identidad: >-
  Para cada periodo del plan de pagos: C(oraculo, Ceil10/Ceil10/RoundHalfEven2)
  == B(iv_payment_plan.interest_amount), dentro de +/- 0.01 y sin sesgo de signo.

matriz_esperada: >-
  A=B=C. El oraculo ya reprodujo las dos cohortes por separado: migrado
  (origin='FINSUS', C=A) al 97.8% y live (origin is null, C=B) al 99.7%, sobre
  300 cuentas cada una. El residual NO es defecto del core: es del metodo — la
  tasa despejada falla en cuentas con cambios a media vida. Cierra cuando exista
  la tasa contratada del esquema.

estado: VALIDADO
estado_origen: "NORTE §1 DEV 2.1.2: A=B=C, migrado 97.8% / live 99.7% (cohortes 300 ctas)"
cobertura_nota: >-
  775/775 periodos con V5 (una cuenta a la vez) y las dos cohortes de origin con
  validate_plazo_origin.py. Este VALIDADOR aun no lo ha corrido a escala.

supuestos:
  - "Aqui `origin is null` SI es delimitador limpio porque iv_payment_plan solo trae FINSUS o null: no tiene tags de canal (DIMO, FINSUS_CREDIT), que son los que le dan semantica mixta a transaction.origin. La regla es POR TABLA. Para transaccional y completitud el delimitador robusto sigue siendo created >= cutover. La taxonomia de origin sigue sin confirmar (SOL-004)."
  - "La tasa se despeja del periodo 1 y se verifica que reproduzca todos los demas. Es prueba fuerte pero NO sustituye leerla de su tabla: si la tasa configurada estuviera mal, el despeje la absorbe y el caso pasaria."
  - "dias_anio se pasa como parametro unico para toda la cohorte. Si la muestra mezclara productos con bases distintas (360 y 365), los de la otra base apareceran como violaciones: hay que leerlo como mezcla de bases, no como defecto del motor."
solicitudes: [SOL-004]
