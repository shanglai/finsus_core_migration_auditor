id: ISR-01
titulo: Retencion de ISR al pago de rendimientos = regla normativa
motor: FIS
dominio: FIS
regla_ref: [K-FIS-002, K-FIS-004, S-FIS-001, K-DEV-001, C-002]
severidad: 1
norte_ref: \"NORTE_VALIDACION.md §1 FIS — ISR retencion al pago (motor B)\"
tolerancia: {tipo: redondeo, max_evento: "0.01", prueba_sesgo: true, alfa_sesgo: "0.01"}

parametros:
  - {nombre: cohorte, tipo: lista_cuentas, requerido: true,
     nota: "account_number '100-2301-X'. En Aurum la cohorte se ancla por cuenta: la llave '100-10-X' no existe alli."}
  - {nombre: fecha_ini, tipo: fecha, requerido: true}
  - {nombre: fecha_fin, tipo: fecha, requerido: true, nota: "exclusiva"}
  - {nombre: anio_causacion, tipo: entero, default: 2026}
  - {nombre: uma_anual, tipo: decimal, default: "42794.64",
     nota: "UMA anual INEGI del anio de causacion. Cambia cada 1-feb (2025: 41273.52)."}
  - {nombre: tasa_anual, tipo: decimal, default: "0.9",
     nota: "porcentaje. LIF 2026 Art. 24 (2025 fue 0.5)."}
  - {nombre: multiplicador_uma, tipo: decimal, default: "5", nota: "LISR Art. 93 fr. XX"}
  - {nombre: dias_anio, tipo: decimal, default: "365", nota: "tax.days.year"}
  - {nombre: modo_final, tipo: texto, default: "RoundHalfEven2",
     nota: "[PENDIENTE menor] S-FIS-001: F-016 no desambigua half_even vs half_up. Es parametro para que la eleccion quede en la evidencia."}

extraccion:
  aurum: PENDIENTE   # ver bloqueo; el borrador esta en isr_al_pago_universo.BORRADOR.sql
  openfin: PENDIENTE

oraculo: oraculos/isr.py::fila_isr_retenido
universo: {fuente: aurum}

comparacion:
  tipo: igualdad_montos
  llaves: [accountholder_id, cuenta_inversion, periodo]
  columna_b: isr_posteado
  columna_c: isr_oraculo
  fuente_b: aurum

identidad: >-
  Para cada evento de retencion: C(oraculo, desde la norma) == B(isr posteado por
  AurumCore), dentro de +/- 0.01 por evento y SIN sesgo de signo. Viola quien no lo cumple.

matriz_esperada: >-
  B == C obligatorio (severidad 1 si falla). El motor A no entra a este caso: OpenFin
  lleva ISR como devengo diario a nivel cliente, no como evento de retencion al pago,
  asi que no hay llave comun al nivel de este universo. Esa diferencia de modelo es
  justamente lo que prueba ISR-02, y aqui la matriz corre etiquetada "sin A" — la
  ausencia de A NO se interpreta como coincidencia.

estado: PARCIAL
estado_origen: "NORTE_VALIDACION.md §1 FIS: VALIDADO, set 3,236/3,236 MODELO, C=B al pago"
bloqueo: >-
  La consulta del universo NO funciona y se retira a borrador. Corrida del
  2026-08-21: el lado B extrae BIEN — aparecieron 46.37, 4.81 y 0.05, que son
  exactamente las tres retenciones del caso de oro de S-FIS-001 — pero el
  universo esta mal armado en dos puntos:
    1. El apareo evento-de-ISR <-> inversion. Tres intentos fallaron: unir por
       accountholder da producto cartesiano y agota el statement_timeout; unir
       contra la cohorte con ON TRUE FABRICA filas (3 eventos -> 27); extraer la
       cuenta de `alfanumeric_reference` por patron vuelve a agotar el timeout
       porque no hay indice que lo soporte. El prefijo de la referencia ademas
       NO es estable ('-100-2301-X', 'Pago de rendimientos-100-2301-X',
       'Pago de rendimientos 10-100-2301-X').
    2. `saldo_total_cliente` sale 0 en todas las filas: el join a
       account_balance_tracking no resuelve, aunque la tabla si tiene datos en
       la ventana (2025-08-22..2026-08-20). Con base 0 el oraculo devuelve 0 y
       las 27 diferencias salieron todas del mismo signo.
  Las 27 violaciones de esa corrida son defecto de ESTA consulta, no de
  AurumCore, y asi quedaron registradas. Reconstruir el universo siguiendo el
  metodo de comparadores/isr_live_nativo.py es el siguiente paso.
cobertura_nota: >-
  Validado previamente fuera de esta herramienta (fase1_isr_desviacion.py,
  3,236/3,236). Este VALIDADOR NO lo ha reproducido todavia.

supuestos:
  - "Delimitador de 'Aurum vivo' = `created >= cutover` (la ventana del caso), NO `origin is null`: transaction.origin tiene semantica mixta y los null aparecen desde abril-2026. `origin` viaja en el universo SOLO como desglose de transparencia. Metodo de isr_live_nativo.py; taxonomia sin confirmar (SOL-004)."
  - "El evento de ISR se aparea con el periodo del plan de pagos por (titular, cuenta de inversion, fecha de pago). Dos pagos del mismo dia por la misma inversion quedan como filas separadas y el comparador las exhibe."
  - "saldo_total_cliente se toma al dia del pago desde account_balance_tracking. S-FIS-001 no fija si debe ser el saldo del dia o el del cierre anterior (P-006). isr_live_nativo.py documenta el mismo caveat: el residual incluye DERIVA DE SALDO, no solo defecto de calculo. Una diferencia aqui no se puede atribuir al motor sin descartar primero la deriva."
  - "Se asume persona fisica (exencion aplicable). LISR Art. 54 excluye retencion a personas morales; el universo no distingue el tipo de persona todavia."
solicitudes: [SOL-004, SOL-011]
