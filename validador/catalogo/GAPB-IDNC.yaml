id: GAPB-IDNC
titulo: Suspension de devengo en cartera vencida — io_venc cancela io
motor: REG
dominio: REG
regla_ref: [K-REG-001, F-023]
severidad: 2
norte_ref: "NORTE_VALIDACION.md §1 REG 2.1.7 — Suspension de devengo / IDNC"
tolerancia: {tipo: contable, max_evento: "0.00", prueba_sesgo: false}

parametros:
  - {nombre: fecha_ini, tipo: fecha, requerido: true, nota: "sobre information_date"}
  - {nombre: fecha_fin, tipo: fecha, requerido: true, nota: "exclusiva"}

extraccion:
  aurum: validador/extraccion/aurum/gapb_idnc_suspension.sql

oraculo: PENDIENTE
universo: {fuente: aurum}

comparacion:
  tipo: suma_cero
  llaves: [contrato, fecha_informacion]
  columnas: [io, io_venc]
  fuente_b: aurum

identidad: >-
  Para todo credito con suspension activa: io + io_venc = 0, EXACTO. Al pasar a
  cartera vencida, io_venc cancela el interes ordinario devengado y el devengo
  deja de reconocerse en resultados (Criterio B-4 CNBV / IFRS9, etapa 3 a los
  90 dias). Viola el contrato cuyo neto no sea 0.00: ahi el devengo NO se suspendio.

matriz_esperada: >-
  Contrario al gap analysis, el mecanismo SI existe y la mecanica ya se reprodujo
  en datos (K-REG-001 v3). Este caso la convierte en invariante permanente.
  Sin motor A: OpenFin no lleva el staging IFRS9 al mismo grano.

estado: VALIDADO
estado_origen: "NORTE §1 REG 2.1.7: CONFIRMADA en datos — io_venc cancela exactamente io"
cobertura_nota: >-
  Mecanica confirmada. Resta lo que este caso NO cubre: barrer la poblacion
  completa y validar la contabilizacion a cuentas de orden y la reserva al 100%.
  Este VALIDADOR aun no lo ha corrido.

supuestos:
  - "El universo se restringe a io_venc <> 0, que son las filas donde la suspension aplica. En un credito vigente io_venc es cero y io no, y la identidad no aplica: incluirlos convertiria todo el universo en violaciones y diria lo contrario de lo que pasa."
  - "Se prueba la MECANICA de la suspension, no su contabilizacion. Que io se cancele no demuestra que el importe haya ido a cuentas de orden ni que la reserva sea del 100%: eso sigue abierto y necesita el doc IFRS9."
