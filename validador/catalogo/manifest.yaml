# Indice del catalogo de casos del VALIDADOR.
#
# FUENTE UNICA (decision C): el catalogo de casos vive en
# 40_validaciones/NORTE_VALIDACION.md. Este directorio es su ESPEJO ejecutable,
# no un catalogo paralelo. Cada YAML declara `norte_ref` con la fila del NORTE
# que espeja; si el NORTE cambia, se re-espeja aqui (ver
# export_auditor/PROMPT_SYNC_AUDITOR.md).
#
# `estado` describe lo que se sabe de la VALIDACION segun el NORTE, no si esta
# herramienta la corrio. Eso vive en reportes/cobertura.md: un caso VALIDADO que
# el validador nunca ejecuto aparece ahi como NO-CORRIDO.

