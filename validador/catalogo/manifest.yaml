# Como crece este catalogo (PROMPT_SYNC_AUDITOR.md):
#   1. La sesion del repo fuente actualiza pieza K -> fila del NORTE -> codigo/SQL.
#   2. Corre ensamblar.py y anota el changelog en export_auditor/MANIFEST.md.
#   3. Aqui se re-espeja el caso, se re-corre lo afectado y se actualiza cobertura.md.
#   4. Hallazgo confirmado -> invariante de regresion permanente en tests/.
