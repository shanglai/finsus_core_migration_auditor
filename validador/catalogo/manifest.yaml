# Indice del catalogo de casos del VALIDADOR.
#
# Debe quedar SINCRONIZADO con los YAML de este directorio y con
# 40_validaciones/NORTE_VALIDACION.md (misma nomenclatura y estado, §7.4).
# `python cli.py --cobertura` verifica la sincronia contra los YAML y reporta
# cualquier discrepancia; la sincronia contra el NORTE es manual.
#
# OJO con la semantica de `estado`: describe lo que se sabe de la VALIDACION
# (segun el NORTE), no si esta herramienta la corrio. Eso ultimo vive en
# reportes/cobertura.md, y un caso VALIDADO que este validador nunca ejecuto
# aparece ahi como NO-CORRIDO.

