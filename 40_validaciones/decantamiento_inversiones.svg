  <text x="481" y="497" font-size="13" font-weight="700" fill="#2f8f66" text-anchor="end">13,521 · 72.7%</text>

  <!-- ===== panel casuística rendimiento ===== -->
  <rect x="700" y="256" width="368" height="118" rx="8" fill="#fdf3e0" stroke="#e0a94f"/>
  <text x="714" y="276" font-size="12.5" font-weight="700" fill="#8a5a2b">Cae en RENDIMIENTO: 90</text>
  <text x="714" y="296" font-size="11.5" fill="#334155">Sesgo unidireccional: <tspan font-weight="700">90 AC&gt;OF, 0 en contra</tspan> (≤$0.05 c/u)</text>
  <text x="714" y="316" font-size="11.5" fill="#334155">• 39 de 1 periodo → <tspan font-weight="700" fill="#c0392b">OpenFin trunca</tspan> (39/39):</text>
  <text x="726" y="333" font-size="11" fill="#475569">~20 DEFECTO_OPENFIN · ~19 por arbitrar (convención de días)</text>
  <text x="714" y="352" font-size="11.5" fill="#334155">• 51 multiperiodo → requieren <tspan font-weight="700">iv_payment_plan</tspan> (Fase 1)</text>
  <text x="714" y="368" font-size="10.5" font-style="italic" fill="#8a8f98">§10: sesgo ≠ 0 → posible severidad 1</text>

  <!-- ===== panel casuística ISR ===== -->
  <rect x="700" y="392" width="368" height="150" rx="8" fill="#fdeaea" stroke="#d98b80"/>
  <text x="714" y="412" font-size="12.5" font-weight="700" fill="#a33">Cae en ISR: 4,988  (el mayor gap, ≈27%)</text>
  <text x="714" y="432" font-size="11.5" fill="#334155"><tspan font-weight="700">Bidireccional</tspan> (no sesgo): 2,480 AC&gt;OF · 2,508 AC&lt;OF</text>
  <text x="714" y="452" font-size="11.5" fill="#334155">• <tspan font-weight="700">3,221 material</tspan> (&gt;$0.10) → cascada de saldo de cuentas</text>
  <text x="714" y="471" font-size="11.5" fill="#334155">• 1,767 redondeo (≤$0.10)</text>
  <text x="714" y="490" font-size="11.5" fill="#334155">• <tspan font-weight="700" fill="#c0392b">664 un core retiene y el otro no</tspan> (297 AC=0 · 367 OF=0)</text>
  <text x="714" y="512" font-size="10.5" font-style="italic" fill="#8a8f98">Aún NO arbitrado por C: requiere recálculo desde la norma</text>
  <text x="714" y="528" font-size="10.5" font-style="italic" fill="#8a8f98">(system_configuration + P-010) sobre el mismo saldo base</text>

  <text x="36" y="560" font-size="11" fill="#94a3b8">Independiente (polars+decimal, offline sobre F-013). Reproduce la hoja maestra del árbol: 13,521 cuadran / ISR cae 4,988 (exacto). El rendimiento (18,509/90) fue recalculado por el motor C.</text>
  <text x="36" y="580" font-size="11" fill="#94a3b8">Lectura: cada variable filtra de forma acumulativa; una inversión sobrevive sólo si A y B coinciden en TODAS las anteriores. Detalle: 40_validaciones/FASE0_VALIDACION_INVERSIONES.md</text>
</svg>
