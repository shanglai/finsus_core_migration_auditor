<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="36" y="40" font-size="21" font-weight="700" fill="#1f2933">Decantamiento de inversiones — OpenFin vs AurumCore</text>
  <text x="36" y="62" font-size="12.5" fill="#64748b">Corte día cero (02-03 ago) · 18,599 en común · acumulativo variable por variable · recálculo independiente (Fase 0)</text>
  <!-- leyenda -->
  <rect x="36" y="80" width="14" height="12" fill="#dcefe4" stroke="#3f9e6f"/><text x="55" y="90" font-size="11" fill="#334155">sobrevive (cuadra)</text>
  <rect x="180" y="80" width="14" height="12" fill="#fde6d6" stroke="#e0a94f"/><text x="199" y="90" font-size="11" fill="#334155">cae (casuística)</text>
  <text x="330" y="90" font-size="11" fill="#334155"><tspan font-weight="700" fill="#2f8f66">[C]</tspan> recalculado por nosotros · <tspan font-weight="700" fill="#8a5a2b">[A/B]</tspan> del árbol (pend. C, P-010) · ancho ∝ nº inversiones</text>

  <!-- ===== barras (cascada) x=40, escala 620/18599 ===== -->
  <!-- 1 pareadas -->
  <rect x="40" y="118" width="620" height="34" rx="4" fill="#dcefe4" stroke="#3f9e6f"/>
  <text x="52" y="139" font-size="12.5" font-weight="700" fill="#1f2933">Cliente + inversión (pareadas)</text>
  <text x="650" y="139" font-size="12" font-weight="700" fill="#2f8f66" text-anchor="end">18,599 · 100%</text>
  <!-- 2 fecha -->
  <rect x="40" y="158" width="620" height="26" rx="4" fill="#dcefe4" stroke="#3f9e6f"/>
  <text x="52" y="175" font-size="11.5" fill="#334155">+ fecha apertura/vencimiento</text>
  <text x="650" y="175" font-size="11.5" fill="#475569" text-anchor="end">18,599 · cae 0</text>
  <!-- 3 monto -->
  <rect x="40" y="190" width="620" height="26" rx="4" fill="#dcefe4" stroke="#3f9e6f"/>
  <text x="52" y="207" font-size="11.5" fill="#334155">+ monto de apertura</text>
  <text x="650" y="207" font-size="11.5" fill="#475569" text-anchor="end">18,599 · cae 0</text>
  <!-- 4 tasa -->
  <rect x="40" y="222" width="620" height="26" rx="4" fill="#dcefe4" stroke="#3f9e6f"/>
  <text x="52" y="239" font-size="11.5" fill="#334155">+ tasa</text>
  <text x="650" y="239" font-size="11.5" fill="#475569" text-anchor="end">18,599 · cae 0</text>
  <!-- 5 rendimiento (cae 90) -->
  <rect x="40" y="258" width="617" height="40" rx="4" fill="#dcefe4" stroke="#3f9e6f" stroke-width="1.4"/>
  <text x="52" y="283" font-size="12.5" font-weight="700" fill="#1f2933">+ rendimiento pagado <tspan font-weight="700" fill="#2f8f66">[C]</tspan></text>
  <text x="650" y="283" font-size="12" font-weight="700" fill="#2f8f66" text-anchor="end">18,509 · cae 90</text>
  <path d="M660,278 L700,300" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- 6 ISR (cae 4988) -->
  <rect x="40" y="392" width="451" height="40" rx="4" fill="#dcefe4" stroke="#3f9e6f" stroke-width="1.4"/>
  <text x="52" y="417" font-size="12.5" font-weight="700" fill="#1f2933">+ ISR retenido <tspan font-weight="700" fill="#8a5a2b">[A/B]</tspan></text>
  <text x="481" y="417" font-size="12" font-weight="700" fill="#b9822a" text-anchor="end">13,521 · cae 4,988</text>
  <path d="M491,412 L700,455" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- 7 terminal cuadran todo -->
  <rect x="40" y="470" width="451" height="44" rx="4" fill="#bfe3cd" stroke="#2f8f66" stroke-width="2"/>
