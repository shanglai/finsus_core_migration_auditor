<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1040" viewBox="0 0 1060 1040" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- fondo blanco -->
  <rect x="0" y="0" width="1060" height="1040" fill="#ffffff"/>

  <!-- Encabezado -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1f2933">Plan de Validación — Flujo de fases y dependencias</text>
  <text x="40" y="68" font-size="13" fill="#64748b">OpenFin ↔ AurumCore · lectura vertical, de arriba a abajo · v1 (borrador)</text>

  <!-- Leyenda -->
  <line x1="40" y1="92" x2="72" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="80" y="96" font-size="11.5" fill="#334155">secuencia</text>
  <circle cx="185" cy="92" r="6" fill="#3f9e6f"/>
  <text x="196" y="96" font-size="11.5" fill="#334155">diseñable hoy</text>
  <circle cx="305" cy="92" r="6" fill="#94a3b8"/>
  <text x="316" y="96" font-size="11.5" fill="#334155">requiere datos</text>
  <text x="430" y="96" font-size="11.5" fill="#334155">P-### = pregunta abierta que bloquea (ver PREGUNTAS_ABIERTAS.md)</text>

  <!-- ===== Fase 0 ===== -->
  <rect x="40" y="128" width="980" height="104" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="1002" cy="146" r="6" fill="#94a3b8"/>
  <text x="56" y="156" font-size="14" font-weight="700" fill="#1f2933">Fase 0 · Habilitación (insumos)</text>
  <text x="56" y="182" font-size="12" fill="#334155">•  Queries de ambos cores  +  diccionario de datos / modelo</text>
  <text x="56" y="202" font-size="12" fill="#334155">•  “Día cero” limpio (base cerrada, sin ingesta)  ·  NDA / accesos  ·  inventario de asíncronas</text>
  <text x="56" y="224" font-size="11" font-style="italic" fill="#64748b">Dep: equipos OpenFin y Aurum (externo) — P-004</text>

  <line x1="530" y1="232" x2="530" y2="266" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Fase 1 ===== -->
  <rect x="40" y="268" width="980" height="104" rx="10" fill="#e8f0fe" stroke="#6b9bf2" stroke-width="1.5"/>
  <circle cx="1002" cy="286" r="6" fill="#3f9e6f"/>
  <text x="56" y="296" font-size="14" font-weight="700" fill="#1f2933">Fase 1 · Universo comparable (“peras con peras”)</text>
  <text x="56" y="322" font-size="12" fill="#334155">•  Llaves de correlación (SPEI 1:1; llave sustituta para reinversiones)  ·  ventanas con delta</text>
  <text x="56" y="342" font-size="12" fill="#334155">•  Exclusiones por diseño (CLABE, reversos, no-atomicidad)  ·  filtro calculado-vs-ingestado</text>
  <text x="56" y="364" font-size="11" font-style="italic" fill="#64748b">Dep: Fase 0 · diccionario de datos (P-004)</text>

  <!-- split hacia banda paralela -->
  <line x1="340" y1="372" x2="340" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="372" x2="840" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Banda paralela: contenedor Fases 2-5 ===== -->
  <rect x="40" y="412" width="600" height="248" rx="10" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="432" font-size="12.5" font-weight="700" fill="#475569">Fases 2–5 · Validaciones internas (familias A/B/C) — en paralelo</text>

  <!-- F2 -->
  <rect x="54" y="448" width="279" height="92" rx="8" fill="#e8f0fe" stroke="#6b9bf2" stroke-width="1.3"/>
  <circle cx="317" cy="464" r="5.5" fill="#94a3b8"/>
  <text x="68" y="470" font-size="12" font-weight="700" fill="#1f2933">F2 · Completitud (A)</text>
  <text x="68" y="492" font-size="10.5" fill="#334155">¿Se come todas? Faltantes A↔B;</text>
  <text x="68" y="507" font-size="10.5" fill="#334155">ninguna operación perdida.</text>
  <text x="68" y="528" font-size="10" font-style="italic" fill="#64748b">Dep: F1 · P-004 / P-009</text>

  <!-- F3 -->
  <rect x="347" y="448" width="279" height="92" rx="8" fill="#e8f0fe" stroke="#6b9bf2" stroke-width="1.3"/>
  <circle cx="610" cy="464" r="5.5" fill="#94a3b8"/>
  <text x="361" y="470" font-size="12" font-weight="700" fill="#1f2933">F3 · Detalle consistente (A)</text>
  <text x="361" y="492" font-size="10.5" fill="#334155">Rollforward · folios · reversas ·</text>
  <text x="361" y="507" font-size="10.5" fill="#334155">neteo diario por cuenta = 0.</text>
  <text x="361" y="528" font-size="10" font-style="italic" fill="#64748b">Dep: F1</text>

  <!-- F4 -->
  <rect x="54" y="548" width="279" height="92" rx="8" fill="#e7f6ec" stroke="#56b487" stroke-width="1.3"/>
  <circle cx="317" cy="564" r="5.5" fill="#94a3b8"/>
  <text x="68" y="570" font-size="12" font-weight="700" fill="#1f2933">F4 · Balanza (B)</text>
  <text x="68" y="592" font-size="10.5" fill="#334155">Doble partida · continuidad ·</text>
  <text x="68" y="607" font-size="10.5" fill="#334155">naturaleza · tolerancia 0.00.</text>
  <text x="68" y="628" font-size="10" font-style="italic" fill="#64748b">Dep: matriz CTB</text>

  <!-- F5 -->
  <rect x="347" y="548" width="279" height="92" rx="8" fill="#e7f6ec" stroke="#56b487" stroke-width="1.3"/>
  <circle cx="610" cy="564" r="5.5" fill="#94a3b8"/>
  <text x="361" y="570" font-size="12" font-weight="700" fill="#1f2933">F5 · Amarre aux.↔mayor (C)</text>
  <text x="361" y="592" font-size="10.5" fill="#334155">Stock/flujo por producto-día ·</text>
  <text x="361" y="607" font-size="10.5" fill="#334155">cuentas puente explicadas.</text>
  <text x="361" y="628" font-size="10" font-style="italic" fill="#64748b">Dep: F3, F4 · matriz CTB</text>

  <!-- ===== F6 Oráculo (paralelo) ===== -->
  <rect x="660" y="412" width="360" height="248" rx="10" fill="#fdf3e0" stroke="#e0a94f" stroke-width="1.5"/>
  <circle cx="1002" cy="430" r="6" fill="#3f9e6f"/>
  <text x="676" y="438" font-size="14" font-weight="700" fill="#1f2933">F6 · Oráculo — ¿calcula bien? (C)</text>
  <text x="676" y="466" font-size="12" fill="#334155">•  ISR — S-FIS-001 (caso de oro listo)</text>
  <text x="676" y="488" font-size="12" fill="#334155">•  Rendimiento vista y plazo — S-DEV-001/002</text>
  <text x="676" y="510" font-size="12" fill="#334155">•  Redondeo explícito por cálculo · decimal</text>
  <text x="676" y="532" font-size="12" fill="#334155">•  Contrasta C contra A y B</text>
  <text x="676" y="560" font-size="11" font-style="italic" fill="#64748b">Dep: parámetros ISR (P-010) ·</text>
  <text x="676" y="576" font-size="11" font-style="italic" fill="#64748b">definición de saldo promedio (P-006)</text>

  <!-- arrows banda -> fila arbitraje -->
  <line x1="340" y1="660" x2="340" y2="706" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="660" x2="840" y2="706" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700,660 L580,706" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== F7 arbitraje ===== -->
  <rect x="40" y="708" width="600" height="116" rx="10" fill="#efe9fb" stroke="#9b7fd4" stroke-width="1.5"/>
  <circle cx="622" cy="726" r="6" fill="#94a3b8"/>
  <text x="56" y="736" font-size="14" font-weight="700" fill="#1f2933">F7 · Cross-motor / arbitraje (D)</text>
  <text x="56" y="762" font-size="12" fill="#334155">•  Misma identidad en A, B y C  ·  matriz de decisión del charter</text>
  <text x="56" y="784" font-size="12" fill="#334155">•  Clasificar cada discrepancia  →  fichas de hallazgo (H-###)</text>
  <text x="56" y="808" font-size="11" font-style="italic" fill="#64748b">Dep: Fases 2–6</text>

  <!-- ===== F8 sesgo ===== -->
  <rect x="660" y="708" width="360" height="116" rx="10" fill="#fdf3e0" stroke="#e0a94f" stroke-width="1.5"/>
  <circle cx="1002" cy="726" r="6" fill="#94a3b8"/>
  <text x="676" y="736" font-size="14" font-weight="700" fill="#1f2933">F8 · Sesgo y materialidad</text>
  <text x="676" y="762" font-size="12" fill="#334155">•  Prueba de signo (redondeo)</text>
  <text x="676" y="784" font-size="12" fill="#334155">•  Impacto anualizado sobre el padrón</text>
  <text x="676" y="808" font-size="11" font-style="italic" fill="#64748b">Dep: Fase 6 (sobre volumen)</text>

  <!-- arrows -> F9 -->
  <line x1="340" y1="824" x2="340" y2="870" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="824" x2="840" y2="870" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== F9 certificación ===== -->
  <rect x="40" y="872" width="980" height="116" rx="10" fill="#dcefe4" stroke="#3f9e6f" stroke-width="1.8"/>
  <circle cx="1002" cy="890" r="6" fill="#94a3b8"/>
  <text x="56" y="900" font-size="14" font-weight="700" fill="#1f2933">F9 · Regresión y certificación</text>
  <text x="56" y="926" font-size="12" fill="#334155">•  Cada hallazgo confirmado → invariante permanente (red de regresión)</text>
  <text x="56" y="948" font-size="12" fill="#334155">•  Reporte go/no-live  ·  escalar DEFECTO_OPENFIN (ISR, CLABE) a Comité</text>
  <text x="56" y="972" font-size="11" font-style="italic" fill="#3f7a5c">Salida: veredicto go/no-live  ·  Dep: Fases 7 y 8</text>

  <text x="40" y="1018" font-size="10.5" fill="#94a3b8">Fuente: 40_validaciones/PLAN_DE_VALIDACION.md · Diseñable hoy sin datos: Fases 1 y 6 (specs). Ejecución (Fases 2–5,7,8): requiere queries+diccionario (P-004) y muestra limpia (P-009).</text>
</svg>
